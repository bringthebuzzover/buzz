[tool.poetry]
name = "buzz-backend"
version = "0.1.0"
description = "Buzz MVP backend — FastAPI + PostgreSQL + JWT auth."
authors = ["Buzz Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.121"
"uvicorn" = {extras = ["standard"], version = ">=0.30"}
pydantic = ">=2.7"
pydantic-settings = ">=2.4"
"sqlalchemy" = {extras = ["asyncio"], version = ">=2.0"}
asyncpg = ">=0.29"
alembic = ">=1.13"
pyjwt = ">=2.8"
cryptography = ">=43.0"
httpx = ">=0.27"
bcrypt = "^5.0.0"
python-multipart = ">=0.0.18"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.21"
ruff = ">=0.7"
mypy = ">=1.10"
black = ">=24.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep these complementary to Black: Black owns whitespace/line-length, Ruff
# owns logic (`F`), pycodestyle errors that survive formatting (`E`), and
# import order (`I`).
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
