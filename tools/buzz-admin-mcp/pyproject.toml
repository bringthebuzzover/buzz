[tool.poetry]
name = "buzz-admin-mcp"
version = "0.1.0"
description = "Stdio MCP for Buzz admin agents (tables + /api/admin actions)."
authors = ["Buzz Team"]
packages = [{ include = "buzz_admin_mcp", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
httpx = ">=0.27"
mcp = ">=1.9"

[tool.poetry.scripts]
buzz-admin-mcp = "buzz_admin_mcp.server:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
