name: CI

on:
  push:
    branches: [main, staging, mvp]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      e2e_repeat:
        description: "How many parallel Playwright E2E jobs to run (stress)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
          - "30"

concurrency:
  # Push/PR: cancel superseded runs. Stress (workflow_dispatch or [e2e-stress-N]
  # commit marker): isolate by run_id and do not cancel.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[e2e-stress-')) && github.run_id || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message || '', '[e2e-stress-') }}

jobs:
  # Build the E2E matrix (1 on normal push/PR; N on workflow_dispatch or
  # commit message marker `[e2e-stress-N]`).
  e2e-matrix:
    name: Plan E2E matrix
    runs-on: ubuntu-latest
    outputs:
      attempts: ${{ steps.set.outputs.attempts }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPEAT: ${{ github.event.inputs.e2e_repeat }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          event = os.environ.get("EVENT_NAME") or ""
          if event == "workflow_dispatch":
              n = int(os.environ.get("DISPATCH_REPEAT") or "1")
          else:
              msg = os.environ.get("COMMIT_MSG") or ""
              m = re.search(r"\[e2e-stress-(\d+)\]", msg)
              n = int(m.group(1)) if m else 1
          n = max(1, min(30, n))
          print(f"attempts={json.dumps(list(range(1, n + 1)))}")
          PY

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: UI primitives leftover hunter
        run: bash scripts/check-ui-primitives.sh

      - name: Type-check
        run: npx tsc --noEmit

      - name: API types in sync with spec
        # Regenerate TS types from the committed openapi.json; fail if they're
        # stale (spec changed but `npm run gen:api` wasn't run). The backend job
        # separately verifies the spec itself matches the route code.
        run: |
          npm run gen:api
          git -C .. diff --exit-code -- frontend/src/api/generated/schema.ts

      - name: Build
        run: npm run build
        env:
          CI: "true"

  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buzz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/buzz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry cache
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Format check (black)
        run: poetry run black --check --diff app/ tests/

      - name: Lint (ruff)
        run: poetry run ruff check app/ tests/

      - name: Type-check (mypy)
        run: poetry run mypy app/

      - name: OpenAPI spec in sync with routes
        # Re-dump the spec from the app and fail if the committed openapi.json is
        # stale (a request/response schema changed but `dump_openapi.py` wasn't
        # run). Keeps the backend the single source of truth for the contract.
        run: |
          poetry run python scripts/dump_openapi.py
          git -C .. diff --exit-code -- openapi.json

      - name: Apply migrations (alembic)
        run: poetry run alembic upgrade head

      - name: Tests (pytest)
        run: poetry run pytest

  frontend-e2e:
    name: Frontend E2E (Playwright) #${{ matrix.attempt }}
    needs: [e2e-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: ${{ fromJSON(needs.e2e-matrix.outputs.attempts) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buzz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Playwright's global-setup + the backend webServer both read these:
      # global-setup runs alembic + seed_e2e against the runner Postgres, and
      # the webServer boots uvicorn in development so dev-login works in tests.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/buzz
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry cache
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-root

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        # --with-deps pulls the runner's system libs alongside chromium; skipping
        # it is the most common cause of CI-only Playwright launch failures.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        # `webServer` in playwright.config.ts boots the backend (cd ../backend,
        # ENVIRONMENT=development, poetry run uvicorn) + frontend (npm start),
        # and global-setup.ts applies migrations + seed_e2e first.
        working-directory: frontend
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # PRs into main must come from staging (or an emergency hotfix/* branch).
  # PRs into staging skip this job.
  promotion-gate:
    name: Promotion gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Head must be staging or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            staging|hotfix/*)
              echo "promotion allowed from ${HEAD_REF}"
              ;;
            *)
              echo "PRs into main must come from staging or hotfix/* (got: ${HEAD_REF})"
              exit 1
              ;;
          esac

  # Public staging URLs. Retries cover the Railway deploy lag after a push.
  # `/` is 200 with no gate, or 401 once STAGING_BASIC_AUTH is set; either
  # response must carry X-Robots-Tag: noindex. /healthz stays 200.
  staging-smoke:
    name: Staging smoke
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Curl staging API and frontend
        run: |
          python3 - <<'PY'
          import time
          import urllib.error
          import urllib.request

          API = "https://api-staging.bringthebuzzover.com/api/health"
          WEB = "https://staging.bringthebuzzover.com/"
          HEALTHZ = "https://staging.bringthebuzzover.com/healthz"

          def fetch(url):
              req = urllib.request.Request(url, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, {k.lower(): v for k, v in resp.headers.items()}
              except urllib.error.HTTPError as exc:
                  return exc.code, {k.lower(): v for k, v in exc.headers.items()}

          def robots_ok(headers):
              value = headers.get("x-robots-tag", "")
              return "noindex" in value.lower()

          last = "no attempt"
          for attempt in range(1, 25):
              try:
                  api_status, _api_headers = fetch(API)
                  web_status, web_headers = fetch(WEB)
                  health_status, health_headers = fetch(HEALTHZ)
                  web_ok = web_status in (200, 401) and robots_ok(web_headers)
                  health_ok = health_status == 200 and (
                      web_status == 200 or robots_ok(health_headers) or robots_ok(web_headers)
                  )
                  if api_status == 200 and web_ok and health_status == 200 and health_ok:
                      print(
                          f"staging smoke ok on attempt {attempt}: "
                          f"api={api_status} web={web_status} healthz={health_status}"
                      )
                      raise SystemExit(0)
                  last = (
                      f"api={api_status} web={web_status} "
                      f"robots={web_headers.get('x-robots-tag', '')!r} "
                      f"healthz={health_status}"
                  )
              except Exception as exc:  # noqa: BLE001 — retry until the deploy is up
                  last = repr(exc)
              print(f"attempt {attempt} not ready: {last}")
              time.sleep(20)
          print(f"staging smoke failed: {last}")
          raise SystemExit(1)
          PY
