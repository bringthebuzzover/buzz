name: Promotion gate

# Separate from CI so an edit of a pull request into main (retarget, title,
# or body) re-checks the head. Forks are refused even when the branch name
# is staging or hotfix/*.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

jobs:
  promotion-gate:
    name: Promotion gate
    runs-on: ubuntu-latest
    steps:
      - name: Head must be this repo's staging or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PRs into main must come from this repository (got head '${HEAD_REPO:-<missing>}')"
            exit 1
          fi
          case "$HEAD_REF" in
            staging|hotfix/*)
              echo "promotion allowed from ${HEAD_REPO}@${HEAD_REF}"
              ;;
            *)
              echo "PRs into main must come from staging or hotfix/* (got: ${HEAD_REF})"
              exit 1
              ;;
          esac
